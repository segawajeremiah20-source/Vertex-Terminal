
name: Build Vertex Terminal Qt 6.6 API 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libltdl-dev unzip curl patchelf \
            openjdk-11-jdk git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Extract original application
        run: |
          test -f vertex_terminal_mobile.zip
          unzip -q vertex_terminal_mobile.zip
          test -f vertex_terminal_mobile/main.py
          test -f vertex_terminal_mobile/build_android.py

      - name: Install Qt 6.6 tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install aqtinstall
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$HOME/Qt"
          aqt install-qt linux android 6.6.3 android_arm64_v8a -O "$HOME/Qt"

      - name: Download PySide 6.6 source
        run: |
          git clone --depth 1 --branch 6.6 \
            https://github.com/pyside/pyside-setup.git qt-pyside

      - name: Install cross compilation requirements
        run: |
          python -m pip install \
            -r qt-pyside/requirements.txt
          python -m pip install \
            -r qt-pyside/tools/cross_compile_android/requirements.txt

      - name: Cross compile PySide6 Android wheels
        run: |
          cd qt-pyside
          python tools/cross_compile_android/main.py \
            --plat-name=aarch64 \
            --api-level=27 \
            --qt-install-path="$HOME/Qt/6.6.3" \
            --auto-accept-license \
            --skip-update

      - name: Locate generated Android wheels
        id: wheels
        run: |
          PYSIDE=$(find qt-pyside/dist_android \
            -name 'PySide6-*-android_aarch64.whl' -print -quit)

          SHIBOKEN=$(find qt-pyside/dist_android \
            -name 'shiboken6-*-android_aarch64.whl' -print -quit)

          test -n "$PYSIDE"
          test -n "$SHIBOKEN"

          echo "pyside=$GITHUB_WORKSPACE/$PYSIDE" >> "$GITHUB_OUTPUT"
          echo "shiboken=$GITHUB_WORKSPACE/$SHIBOKEN" >> "$GITHUB_OUTPUT"

          ls -lh "$PYSIDE" "$SHIBOKEN"

      - name: Install PySide6 deployment tools
        run: |
          python -m pip install \
            PySide6==6.6.3 \
            buildozer cython jinja2 pkginfo tqdm

      - name: Build Vertex Terminal APK
        working-directory: vertex_terminal_mobile
        run: |
          python build_android.py \
            --wheel-pyside "${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken "${{ steps.wheels.outputs.shiboken }}" \
            --name VertexTerminal -f

      - name: Collect APK
        run: |
          APK=$(find vertex_terminal_mobile \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/VertexTerminal-Qt66-debug.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VertexTerminal-Qt66-API27
          path: output/VertexTerminal-Qt66-debug.apk
          if-no-files-found: error
          retention-days: 14
