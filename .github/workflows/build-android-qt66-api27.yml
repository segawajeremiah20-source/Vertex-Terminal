name: Build Vertex Terminal Qt 6.6 API 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Qt + NDK + PySide build is large; free some runner disk first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libltdl-dev unzip curl patchelf \
            openjdk-11-jdk git \
            clang-14 llvm-14 \
            libclang-14-dev llvm-14-dev libclang-cpp14-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Extract original application
        run: |
          test -f vertex_terminal_mobile.zip
          unzip -q vertex_terminal_mobile.zip
          test -f vertex_terminal_mobile/main.py
          test -f vertex_terminal_mobile/build_android.py

      - name: Install Qt 6.6 tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install aqtinstall
          aqt install-qt linux desktop 6.6.3 gcc_64 -O "$HOME/Qt"
          aqt install-qt linux android 6.6.3 android_arm64_v8a -O "$HOME/Qt"
          test -d "$HOME/Qt/6.6.3/gcc_64"
          test -d "$HOME/Qt/6.6.3/android_arm64_v8a"

      - name: Download PySide 6.6 source
        run: |
          git clone --depth 1 --branch 6.6 \
            https://github.com/pyside/pyside-setup.git qt-pyside

      - name: Patch Shiboken Android parser include paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("qt-pyside/sources/pyside6/cmake/Macros/PySideModules.cmake")
          source = path.read_text()

          needle = " --api-version=${SUPPORTED_QT_VERSION})"
          addition = needle + """
          if(DEFINED ENV{ANDROID_NDK_SYSROOT_INCLUDE})
            list(APPEND shiboken_command
              "--system-include-paths=$ENV{ANDROID_NDK_SYSROOT_INCLUDE}")
          endif()
          """

          if source.count(needle) != 1:
              raise SystemExit("ERROR: Shiboken command insertion point was not unique")

          path.write_text(source.replace(needle, addition, 1))
          print("SUCCESS: Android NDK headers are configured for Shiboken only.")
          PY

      - name: Patch Qt host path detection
        run: |
          grep -n 'QFP_QT_TARGET_PATH' qt-pyside/build_scripts/qtinfo.py || true
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("qt-pyside/build_scripts/qtinfo.py")
          source = path.read_text()

          pattern = r'(?m)^([ ]*)cmake_cache_args\.append\(\("QFP_QT_TARGET_PATH", self\._qt_target_path\)\)$'

          def replacement(match):
              indent = match.group(1)
              return (
                  f'{indent}cmake_cache_args.append(("QFP_QT_TARGET_PATH", self._qt_target_path))\n'
                  f'{indent}qt_host_path = os.environ.get("QT_HOST_PATH")\n'
                  f'{indent}if qt_host_path:\n'
                  f'{indent}    cmake_cache_args.append(("QT_HOST_PATH", qt_host_path))'
              )

          source, count = re.subn(pattern, replacement, source)
          # qtinfo.py has two call sites: _get_query_properties and
          # _get_cmake_mkspecs_variables. Both run a CMake config test that
          # needs QT_HOST_PATH when cross-compiling.
          if count != 2:
              raise SystemExit(
                  f"ERROR: Expected two Qt target path lines in qtinfo.py, found {count}"
              )

          if not re.search(r'(?m)^import os\b', source):
              source = "import os\n" + source

          path.write_text(source)
          print(f"SUCCESS: Qt host path patch applied to {count} locations.")
          PY

      - name: Install cross compilation requirements
        run: |
          python -m pip install -r qt-pyside/requirements.txt
          python -m pip install -r qt-pyside/tools/cross_compile_android/requirements.txt

      - name: Check Qt and compiler installations
        run: |
          test -f "$HOME/Qt/6.6.3/gcc_64/bin/qmake"
          test -d "$HOME/Qt/6.6.3/android_arm64_v8a"
          clang-14 --version
          llvm-config-14 --version
          echo "Qt installations and host compiler are ready."

      - name: Cross compile PySide6 Android wheels
        run: |
          cd qt-pyside

          export QT_HOST_PATH="$HOME/Qt/6.6.3/gcc_64"

          # The PySide 6.6 helper downloads NDK r25c into this cache.
          export ANDROID_NDK_ROOT="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r25c"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          NDK_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export ANDROID_NDK_SYSROOT_INCLUDE="$NDK_SYSROOT/usr/include:$NDK_SYSROOT/usr/include/aarch64-linux-android"

          echo "Host Qt: $QT_HOST_PATH"
          echo "Android Qt: $HOME/Qt/6.6.3/android_arm64_v8a"
          echo "Expected Android NDK: $ANDROID_NDK_ROOT"
          echo "Shiboken parser include paths: $ANDROID_NDK_SYSROOT_INCLUDE"

          # Do not set CPATH, C_INCLUDE_PATH, or CPLUS_INCLUDE_PATH here.
          # Those variables contaminate the Linux host compiler.
          set -o pipefail
          python tools/cross_compile_android/main.py \
            --plat-name=aarch64 \
            --api-level=27 \
            --qt-install-path="$HOME/Qt/6.6.3" \
            --auto-accept-license \
            --skip-update \
            --verbose 2>&1 | tee ../qt66-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qt66-Build-Log
          path: qt66-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Android wheels and NDK headers
        run: |
          NDK_HEADER="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/GLES2/gl2.h"
          test -f "$NDK_HEADER" || {
            echo "ERROR: Android GLES2 header was not found."
            find "$HOME/.pyside6_android_deploy" -path '*/sysroot/usr/include/GLES2/gl2.h' -print
            exit 1
          }
          find qt-pyside/dist_android -name '*.whl' -ls
          test -n "$(find qt-pyside/dist_android -name 'PySide6-*-android_aarch64.whl' -print -quit)"
          test -n "$(find qt-pyside/dist_android -name 'shiboken6-*-android_aarch64.whl' -print -quit)"

      - name: Locate generated Android wheels
        id: wheels
        run: |
          PYSIDE=$(find qt-pyside/dist_android \
            -name 'PySide6-*-android_aarch64.whl' \
            -print -quit)
          SHIBOKEN=$(find qt-pyside/dist_android \
            -name 'shiboken6-*-android_aarch64.whl' \
            -print -quit)

          if [ -z "$PYSIDE" ] || [ -z "$SHIBOKEN" ]; then
            echo "ERROR: Required Android wheels were not found."
            find qt-pyside -name '*.whl'
            exit 1
          fi

          echo "pyside=$GITHUB_WORKSPACE/$PYSIDE" >> "$GITHUB_OUTPUT"
          echo "shiboken=$GITHUB_WORKSPACE/$SHIBOKEN" >> "$GITHUB_OUTPUT"
          ls -lh "$PYSIDE" "$SHIBOKEN"

      - name: Install PySide6 deployment tools
        run: |
          python -m pip install \
            PySide6==6.6.3 \
            buildozer cython jinja2 pkginfo tqdm

      - name: Build Vertex Terminal APK
        working-directory: vertex_terminal_mobile
        run: |
          python build_android.py \
            --wheel-pyside "${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken "${{ steps.wheels.outputs.shiboken }}" \
            --name VertexTerminal -f

      - name: Collect APK
        run: |
          APK=$(find vertex_terminal_mobile -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/VertexTerminal-Qt66-API27.apk
          ls -lh output/

      - name: Verify APK package
        run: |
          APK="output/VertexTerminal-Qt66-API27.apk"
          test -f "$APK"
          unzip -t "$APK"
          echo "APK file integrity check passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VertexTerminal-Qt66-API27
          path: output/VertexTerminal-Qt66-API27.apk
          if-no-files-found: error
          retention-days: 14
